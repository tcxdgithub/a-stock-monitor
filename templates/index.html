<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>A股资金流向</title>
<script src="https://cdn.jsdelivr.net/npm/echarts@5.5.1/dist/echarts.min.js"></script>
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{background:#0f172a;color:#e2e8f0;font-family:system-ui,-apple-system,sans-serif}
.hd{text-align:center;padding:14px 0 6px;border-bottom:1px solid #1e293b}
.hd h1{font-size:22px;color:#3b82f6;letter-spacing:3px}
.hd small{color:#64748b;font-size:12px}
.tabs{display:flex;justify-content:center;gap:8px;padding:10px 0}
.tabs button{padding:6px 22px;border:1px solid #334155;border-radius:6px;background:#1e293b;color:#94a3b8;cursor:pointer;font-size:13px}
.tabs button.on{background:#1e40af;color:#fff;border-color:#3b82f6}
.wrap{display:grid;grid-template-columns:1fr 1fr;gap:10px;padding:0 14px 14px}
.card{background:#1e293b;border-radius:8px;padding:10px;min-height:420px}
.card h3{font-size:13px;color:#60a5fa;border-left:3px solid #3b82f6;padding-left:8px;margin-bottom:8px}
.box{width:100%;height:380px}
.tbl{max-height:370px;overflow-y:auto;font-size:12px}
.tbl::-webkit-scrollbar{width:3px}
.tbl::-webkit-scrollbar-thumb{background:#475569;border-radius:2px}
table{width:100%;border-collapse:collapse}
th{color:#64748b;text-align:left;padding:5px 3px;border-bottom:1px solid #334155}
td{padding:4px 3px;border-bottom:1px solid #1e293b}
tr:hover{background:#334155}
.cup{color:#ef4444}.cdn{color:#22c55e}
#ld{position:fixed;inset:0;background:#0f172a;z-index:99;display:flex;flex-direction:column;align-items:center;justify-content:center}
#ld h2{color:#3b82f6;margin-bottom:10px}
#ld p{color:#94a3b8;font-size:13px}
.bar{margin-top:14px;width:160px;height:3px;background:#334155;border-radius:2px;overflow:hidden}
.bar i{display:block;width:30%;height:100%;background:#3b82f6;border-radius:2px;animation:la 1.5s ease-in-out infinite}
@keyframes la{0%{margin-left:0;width:10%}50%{width:60%}100%{margin-left:90%;width:10%}}
.sug-item:hover{background:#334155!important}
.config-btn{position:fixed;bottom:20px;right:80px;background:#1e293b;color:#94a3b8;border:1px solid #334155;border-radius:50%;width:48px;height:48px;font-size:18px;cursor:pointer;box-shadow:0 4px 12px rgba(0,0,0,.3);z-index:50}
.config-btn:hover{background:#334155;color:#e2e8f0}
.modal-overlay{position:fixed;inset:0;background:rgba(0,0,0,.6);z-index:100;display:flex;align-items:center;justify-content:center}
.modal{background:#1e293b;border-radius:12px;padding:20px;max-width:400px;width:90%;max-height:80vh;overflow-y:auto}
.modal h3{color:#3b82f6;font-size:16px;margin-bottom:15px;text-align:center}
.modal-item{display:flex;align-items:center;justify-content:space-between;padding:10px;border-bottom:1px solid #334155}
.modal-item:last-child{border-bottom:none}
.modal-item label{color:#e2e8f0;font-size:14px;cursor:pointer;flex:1}
.modal-item input[type=checkbox]{width:18px;height:18px;cursor:pointer;accent-color:#3b82f6}
.modal-btns{display:flex;gap:10px;margin-top:15px}
.modal-btns button{flex:1;padding:10px;border:none;border-radius:6px;font-size:14px;cursor:pointer}
.btn-save{background:#1e40af;color:#fff}
.btn-cancel{background:#334155;color:#94a3b8}
</style>
</head>
<body>
<div id="ld"><h2>A股资金流向</h2><p id="ltxt">加载中...</p><div class="bar"><i></i></div></div>

<div class="hd"><h1>A股资金流向监控</h1><small id="tm"></small></div>
<div class="tabs" id="tabs">
<button class="on" data-t="sector">行业板块</button>
<button data-t="concept">概念板块</button>
<button data-t="stock">热门个股</button>
<button data-t="sentiment" style="color:#a855f7">市场情绪</button>
<button data-t="value" style="color:#f59e0b">低位埋伏</button>
<button data-t="short" style="color:#ef4444">短线交易</button>
<button data-t="etf" style="color:#06b6d4">ETF</button>
<button data-t="analyze">个股分析</button>
<button data-t="history">历史记录</button>
</div>

<div class="wrap" id="p-sector"></div>
<div id="p-predict-sector" style="margin:0 14px 14px;background:#1e293b;border-radius:8px;padding:10px;min-height:80px"></div>
<div class="wrap" id="p-concept" style="display:none"></div>
<div id="p-predict-concept" style="display:none;margin:0 14px 14px;background:#1e293b;border-radius:8px;padding:10px;min-height:80px"></div>
<div class="wrap" id="p-stock" style="display:none"></div>
<div id="p-predict-stock" style="display:none;margin:0 14px 14px;background:#1e293b;border-radius:8px;padding:10px;min-height:80px"></div>
<div id="p-sentiment" style="display:none;padding:0 14px 14px"></div>
<div id="p-value" style="display:none;padding:0 14px 14px"></div>
<div id="p-short" style="display:none;padding:0 14px 14px"></div>
<div id="p-etf" style="display:none;padding:0 14px 14px"></div>
<div id="p-analyze" style="display:none;padding:0 14px 14px"></div>
<div id="p-history" style="display:none;padding:0 14px 14px"></div>

<button class="refresh-btn" onclick="location.reload()" title="刷新">&#x21bb;</button>
<button class="config-btn" onclick="openConfig()" title="配置模块">⚙</button>

<div id="config-modal" class="modal-overlay" style="display:none" onclick="if(event.target===this)closeConfig()">
<div class="modal">
  <h3>选择显示模块</h3>
  <div class="modal-item"><label for="cfg-sector">行业板块</label><input type="checkbox" id="cfg-sector" data-m="sector" checked></div>
  <div class="modal-item"><label for="cfg-concept">概念板块</label><input type="checkbox" id="cfg-concept" data-m="concept" checked></div>
  <div class="modal-item"><label for="cfg-stock">热门个股</label><input type="checkbox" id="cfg-stock" data-m="stock" checked></div>
  <div class="modal-item"><label for="cfg-sentiment">市场情绪</label><input type="checkbox" id="cfg-sentiment" data-m="sentiment" checked></div>
  <div class="modal-item"><label for="cfg-value">低位埋伏</label><input type="checkbox" id="cfg-value" data-m="value" checked></div>
  <div class="modal-item"><label for="cfg-short">短线交易</label><input type="checkbox" id="cfg-short" data-m="short" checked></div>
  <div class="modal-item"><label for="cfg-etf">ETF</label><input type="checkbox" id="cfg-etf" data-m="etf" checked></div>
  <div class="modal-item"><label for="cfg-analyze">个股分析</label><input type="checkbox" id="cfg-analyze" data-m="analyze" checked></div>
  <div class="modal-item"><label for="cfg-history">历史记录</label><input type="checkbox" id="cfg-history" data-m="history" checked></div>
  <div style="border-top:1px solid #334155;margin:10px 0"></div>
  <div class="modal-item">
    <label>风险偏好</label>
    <select id="cfg-risk" style="padding:6px 10px;border:1px solid #334155;border-radius:4px;background:#0f172a;color:#e2e8f0;font-size:13px">
      <option value="conservative">保守（止损-2%，仓位15%）</option>
      <option value="moderate" selected>稳健（止损-3%，仓位20%）</option>
      <option value="aggressive">激进（止损-5%，仓位30%）</option>
    </select>
  </div>
  <div class="modal-item">
    <label>评分权重</label>
    <select id="cfg-preset" style="padding:6px 10px;border:1px solid #334155;border-radius:4px;background:#0f172a;color:#e2e8f0;font-size:13px">
      <option value="balanced" selected>均衡模式（各维度均衡）</option>
      <option value="market_first">大盘优先（大盘35%）</option>
      <option value="technical_first">技术优先（技术40%）</option>
      <option value="value_first">价值优先（估值40%）</option>
    </select>
  </div>
  <div class="modal-btns">
    <button class="btn-cancel" onclick="closeConfig()">取消</button>
    <button class="btn-save" onclick="saveConfig()">保存</button>
  </div>
</div>
</div>

<script>
const ALL_MODULES=['sector','concept','stock','sentiment','value','short','etf','analyze','history'];
const MODULE_NAMES={sector:'行业板块',concept:'概念板块',stock:'热门个股',sentiment:'市场情绪',value:'低位埋伏',short:'短线交易',analyze:'个股分析',history:'历史记录'};
const F=v=>{if(v==null||isNaN(v))return'--';let a=Math.abs(v);if(a>=1e12)return(v/1e12).toFixed(2)+'万亿';if(a>=1e8)return(v/1e8).toFixed(2)+'亿';if(a>=1e4)return(v/1e4).toFixed(2)+'万';return v.toFixed(2)};
const P=v=>v==null?'--':v.toFixed(2)+'%';
const C=v=>v>=0?'cup':'cdn';
setInterval(()=>{document.getElementById('tm').textContent=new Date().toLocaleString('zh-CN')},1000);
document.getElementById('tm').textContent=new Date().toLocaleString('zh-CN');

/* Config Management */
function getConfig(){try{return JSON.parse(localStorage.getItem('stock_modules_config')||'null')}catch(e){return null}}
function setConfig(cfg){localStorage.setItem('stock_modules_config',JSON.stringify(cfg))}
function openConfig(){
  const cfg=getConfig()||ALL_MODULES;
  document.querySelectorAll('#config-modal input[type=checkbox]').forEach(cb=>{cb.checked=cfg.includes(cb.dataset.m)});
  const riskPref=localStorage.getItem('riskPref')||'moderate';
  const weightPreset=localStorage.getItem('weightPreset')||'balanced';
  document.getElementById('cfg-risk').value=riskPref;
  document.getElementById('cfg-preset').value=weightPreset;
  document.getElementById('config-modal').style.display='flex';
}
function closeConfig(){document.getElementById('config-modal').style.display='none'}
function saveConfig(){
  const selected=[];
  document.querySelectorAll('#config-modal input[type=checkbox]:checked').forEach(cb=>{selected.push(cb.dataset.m)});
  if(!selected.length){alert('至少选择一个模块');return}
  const riskPref=document.getElementById('cfg-risk').value;
  const weightPreset=document.getElementById('cfg-preset').value;
  localStorage.setItem('riskPref',riskPref);
  localStorage.setItem('weightPreset',weightPreset);
  setConfig(selected);applyConfig(selected);closeConfig();
}
function applyConfig(modules){
  document.querySelectorAll('.tabs button').forEach(btn=>{btn.style.display=modules.includes(btn.dataset.t)?'':'none'});
  ALL_MODULES.forEach(m=>{
    const el=document.getElementById('p-'+m);if(el&&m!==currentTab)el.style.display='none';
    const pred=document.getElementById('p-predict-'+m);if(pred)pred.style.display='none';
  });
  if(!modules.includes(currentTab)){currentTab=modules[0]||'sector';document.querySelector(`.tabs button[data-t="${currentTab}"]`).classList.add('on')}
  const el=document.getElementById('p-'+currentTab);if(el)el.style.display='';
}
let currentTab='sector';
(function(){const cfg=getConfig();if(cfg){currentTab=cfg.includes('sector')?'sector':cfg[0]||'sector';applyConfig(cfg)}})();

document.getElementById('tabs').onclick=e=>{
  if(e.target.tagName!=='BUTTON')return;
  document.querySelectorAll('.tabs button').forEach(b=>b.classList.remove('on'));
  e.target.classList.add('on');
  const t=e.target.dataset.t;currentTab=t;
  ['sector','concept','stock','sentiment','value','short','etf','analyze','history'].forEach(n=>{
    const el=document.getElementById('p-'+n);
    if(el)el.style.display=n===t?'':'none';
    const pred=document.getElementById('p-predict-'+n);
    if(pred)pred.style.display=n===t?'':'none';
  });
  if(!window['done_'+t]){window['done_'+t]=1;window['load_'+t]?window['load_'+t]():0}
  setTimeout(()=>window.dispatchEvent(new Event('resize')),50);
};

function mkChart(id){return echarts.init(document.getElementById(id),'dark')}
function mkPanel(title,chartFn,tableFn,id){
  document.getElementById(id).innerHTML=`<div class="card"><h3>${title} 净流入 TOP15</h3><div class="box" id="c-${id}"></div></div><div class="card"><h3>${title} 明细</h3><div class="tbl" id="t-${id}"></div></div>`;
  chartFn('c-'+id);
  tableFn('t-'+id);
}

/* 行业 */
window.load_sector=async()=>{
  const d=(await(await fetch('/api/sector_flow')).json()).data;
  if(!d.length)return;
  const top15=d.slice(0,15).sort((a,b)=>a.net_inflow-b.net_inflow);
  mkPanel('行业',cid=>{
    mkChart(cid).setOption({tooltip:{trigger:'axis'},grid:{left:90,right:45,top:5,bottom:5},xAxis:{type:'value',axisLabel:{formatter:F},splitLine:{lineStyle:{color:'#334155'}}},yAxis:{type:'category',data:top15.map(x=>x.name),axisLabel:{color:'#e2e8f0',fontSize:11}},series:[{type:'bar',data:top15.map(x=>({value:x.net_inflow,itemStyle:{color:x.net_inflow>=0?'#ef4444':'#22c55e'}})),label:{show:true,position:'right',formatter:p=>F(p.value),color:'#e2e8f0',fontSize:10}}]});
  },tid=>{
    let h='<table><tr><th>板块</th><th>净流入</th><th>流入</th><th>流出</th><th>领涨</th><th>涨幅</th></tr>';
    d.forEach(x=>h+=`<tr><td>${x.name}</td><td class="${C(x.net_inflow)}">${F(x.net_inflow)}</td><td class="cup">${F(x.in_amount)}</td><td class="cdn">${F(x.out_amount)}</td><td>${x.top_stock}</td><td class="${C(x.top_change)}">${P(x.top_change)}</td></tr>`);
    document.getElementById(tid).innerHTML=h+'</table>';
  },'p-sector');

  // 加载板块预测
  loadSectorPredict('0','p-predict-sector');
};

async function loadSectorPredict(fenlei, targetId){
  const el=document.getElementById(targetId||'p-predict-sector');
  if(!el)return;
  el.innerHTML='<div style="text-align:center;color:#64748b;padding:15px">预测分析中...</div>';
  try{
    const r=await fetch('/api/sector_predict?fenlei='+fenlei);
    const j=await r.json();
    if(j.code!==0||!j.data.length){
      el.innerHTML='<div style="text-align:center;color:#64748b;padding:15px">暂无预测信号</div>';return;
    }
    const colors={"超跌反弹":"#22c55e","底部吸筹":"#3b82f6","主力试盘":"#a855f7","强势蓄力":"#ef4444","洗盘信号":"#f59e0b"};
    let h='<div style="color:#64748b;font-size:12px;margin-bottom:6px">明日资金可能流向</div><table><tr><th>类型</th><th>板块</th><th>强度</th><th>可信度</th><th>领涨</th><th>净流入</th><th>依据</th></tr>';
    j.data.forEach(x=>{
      const c=colors[x.type]||'#94a3b8';
      h+=`<tr>
        <td style="color:${c};font-weight:bold">${x.type}</td>
        <td>${x.name}</td>
        <td><div style="background:#0f172a;border-radius:4px;height:14px;width:80px;display:inline-block;vertical-align:middle"><div style="background:${c};height:100%;width:${Math.min(100,x.score)}%;border-radius:4px"></div></div> <span style="font-size:10px">${x.score}</span></td>
        <td style="color:${x.confidence==='高'?'#22c55e':'#f59e0b'};font-size:12px">${x.confidence}</td>
        <td style="font-size:12px">${x.top_stock}</td>
        <td class="${C(x.net_inflow)}" style="font-size:12px">${F(x.net_inflow)}</td>
        <td style="font-size:11px;color:#94a3b8;max-width:180px">${x.reason}</td>
      </tr>`;
    });
    el.innerHTML=h+'</table>';
  }catch(e){el.innerHTML='<div style="color:#ef4444;padding:15px">请求失败</div>'}
}

/* 概念 */
window.load_concept=async()=>{
  const d=(await(await fetch('/api/concept_flow')).json()).data;
  if(!d.length)return;
  const top15=d.slice(0,15).sort((a,b)=>a.net_inflow-b.net_inflow);
  mkPanel('概念',cid=>{
    mkChart(cid).setOption({tooltip:{trigger:'axis'},grid:{left:100,right:45,top:5,bottom:5},xAxis:{type:'value',axisLabel:{formatter:F},splitLine:{lineStyle:{color:'#334155'}}},yAxis:{type:'category',data:top15.map(x=>x.name),axisLabel:{color:'#e2e8f0',fontSize:11}},series:[{type:'bar',data:top15.map(x=>({value:x.net_inflow,itemStyle:{color:x.net_inflow>=0?'#ef4444':'#22c55e'}})),label:{show:true,position:'right',formatter:p=>F(p.value),color:'#e2e8f0',fontSize:10}}]});
  },tid=>{
    let h='<table><tr><th>概念</th><th>净流入</th><th>流入</th><th>流出</th><th>领涨</th><th>涨幅</th></tr>';
    d.forEach(x=>h+=`<tr><td>${x.name}</td><td class="${C(x.net_inflow)}">${F(x.net_inflow)}</td><td class="cup">${F(x.in_amount)}</td><td class="cdn">${F(x.out_amount)}</td><td>${x.top_stock}</td><td class="${C(x.top_change)}">${P(x.top_change)}</td></tr>`);
    document.getElementById(tid).innerHTML=h+'</table>';
  },'p-concept');

  // 加载概念预测
  loadSectorPredict('1','p-predict-concept');
};

/* 个股 */
window.load_stock=async()=>{
  const d=(await(await fetch('/api/stock_flow')).json()).data;
  if(!d.length)return;
  const top15=d.slice(0,15).sort((a,b)=>a.amount-b.amount);
  mkPanel('个股',cid=>{
    mkChart(cid).setOption({tooltip:{trigger:'axis'},grid:{left:80,right:45,top:5,bottom:5},xAxis:{type:'value',axisLabel:{formatter:F},splitLine:{lineStyle:{color:'#334155'}}},yAxis:{type:'category',data:top15.map(x=>x.name),axisLabel:{color:'#e2e8f0',fontSize:11}},series:[{type:'bar',data:top15.map(x=>({value:x.amount,itemStyle:{color:x.pct_change>=0?'#ef4444':'#22c55e'}})),label:{show:true,position:'right',formatter:p=>F(p.value),color:'#e2e8f0',fontSize:10}}]});
  },tid=>{
    let h='<table><tr><th>代码</th><th>名称</th><th>价格</th><th>涨跌%</th><th>成交额</th><th>换手%</th></tr>';
    d.forEach(x=>h+=`<tr><td>${x.code}</td><td>${x.name}</td><td>${x.latest}</td><td class="${C(x.pct_change)}">${P(x.pct_change)}</td><td>${F(x.amount)}</td><td>${x.turnover}%</td></tr>`);
    document.getElementById(tid).innerHTML=h+'</table>';
  },'p-stock');

  // 加载个股预测
  loadStockPredict();
};

async function loadStockPredict(){
  const el=document.getElementById('p-predict-stock');
  if(!el)return;
  el.innerHTML='<div style="text-align:center;color:#64748b;padding:15px">预测分析中...</div>';
  try{
    const r=await fetch('/api/stock_predict');
    const j=await r.json();
    if(j.code!==0||!j.data.length){
      el.innerHTML='<div style="text-align:center;color:#64748b;padding:15px">暂无预测信号</div>';return;
    }
    const colors={"资金关注":"#3b82f6","底部吸筹":"#22c55e","强势启动":"#ef4444"};
    let h='<div style="color:#64748b;font-size:12px;margin-bottom:6px">明日可能启动的个股</div><table><tr><th>类型</th><th>个股</th><th>强度</th><th>可信度</th><th>涨跌</th><th>成交额</th><th>依据</th></tr>';
    j.data.forEach(x=>{
      const c=colors[x.type]||'#94a3b8';
      h+=`<tr>
        <td style="color:${c};font-weight:bold">${x.type}</td>
        <td>${x.name} <span style="color:#64748b;font-size:11px">${x.code}</span></td>
        <td><div style="background:#0f172a;border-radius:4px;height:14px;width:80px;display:inline-block;vertical-align:middle"><div style="background:${c};height:100%;width:${Math.min(100,x.score)}%;border-radius:4px"></div></div> <span style="font-size:10px">${x.score}</span></td>
        <td style="color:${x.confidence==='高'?'#22c55e':'#f59e0b'};font-size:12px">${x.confidence}</td>
        <td class="${C(x.pct_change)}" style="font-size:12px">${P(x.pct_change)}</td>
        <td style="font-size:12px">${F(x.amount)}</td>
        <td style="font-size:11px;color:#94a3b8;max-width:180px">${x.reason}</td>
      </tr>`;
    });
    el.innerHTML=h+'</table>';
  }catch(e){el.innerHTML='<div style="color:#ef4444;padding:15px">请求失败</div>'}
}

/* 低位埋伏(价值投资) */
window.load_value=async()=>{
  const el=document.getElementById('p-value');
  el.innerHTML='<div style="text-align:center;color:#64748b;padding:20px">分析中，正在筛选低估值+高股息+超跌股票...</div>';
  try{
    const r=await fetch('/api/value_stocks');
    const j=await r.json();
    if(j.code!==0||!j.data.length){el.innerHTML='<div style="text-align:center;color:#64748b;padding:20px">暂无符合条件的股票</div>';return}
    let h=`<div style="background:#1e293b;border-radius:8px;padding:12px;margin-bottom:10px">
      <div style="color:#f59e0b;font-weight:bold;font-size:15px;margin-bottom:6px">低位埋伏策略</div>
      <div style="color:#94a3b8;font-size:12px">筛选条件：低PE + 低PB + 52周高点大幅回撤 + 接近低点 | 适合中长期持有</div>
    </div>`;
    h+=`<div class="card" style="min-height:auto"><div class="tbl"><table><tr>
      <th>评分</th><th>代码</th><th>名称</th><th>现价</th><th>涨跌</th>
      <th>PE</th><th>PB</th><th>距高点</th><th>距低点</th><th>成交额</th><th>建议</th>

async function yxScan(){
  const btn=document.getElementById('yx-scan-btn'),st=document.getElementById('yx-scan-status'),el=document.getElementById('yx-results');

  if(st)st.textContent='扫描全A成交额Top200池(限流时自动换源重试)...';
  try{
    const r=await fetch('/api/yinxian/scan');
    const j=await r.json();
    if(j.code===0){
      const d=j.data||[];
      if(st)st.textContent=`扫描${j.pool}只,命中${d.length}只 | ${j.time} | 耗时${j.cost}s`;
      const s=j.stats||{};
      const order=['粗筛','K线不足25日','K线不足21日','R1非阴线','R2非缩量','R3未回踩MA10','R4前期无爆量','R5非温和向上','R6均线发散','解析异常','K线获取失败','异常','命中'];
      const statHtml=Object.keys(s).length?`<div style="margin-top:8px;padding:7px 10px;background:#0f172a;border:1px solid #1e293b;border-radius:7px;font-size:11px;color:#94a3b8">📊 漏斗: `+
        order.filter(k=>s[k]!==undefined).map(k=>`<b style="color:${k==='命中'?'#22c55e':'#cbd5e1'}">${k} ${s[k]}</b>`).join('<span style="color:#334155"> → </span>')+
        `</div>`:'';
      el.innerHTML=d.length?`<div class="tbl"><table><tr><th>评分</th><th>代码</th><th>名称</th><th>现价</th><th>涨幅</th><th>MA10</th><th>缩量</th><th>前期爆量</th><th>10/20距离</th><th>规则核验</th><th>操作</th></tr>`+
        d.map(x=>`<tr>
          <td style="color:${x.score>=70?'#ef4444':'#f59e0b'};font-weight:bold">${x.score}</td>
          <td>${x.code}</td><td>${x.name}</td><td>${x.price}</td>
          <td class="${x.pct>=0?'cup':'cdn'}">${x.pct>=0?'+':''}${x.pct}%</td>
          <td>${x.ma10}</td><td>${x.shrink}×昨</td><td>${x.surge}×均量</td><td>${x.gap_pct}%</td>
          <td style="font-size:10px;color:#64748b">${Object.values(x.checks).join(' | ')}</td>
          <td><button onclick="yxBuy('${x.symbol}','${x.code}','${x.name}',${x.price})" style="padding:3px 12px;background:#22c55e;color:#fff;border:none;border-radius:5px;font-size:11px;cursor:pointer">买入</button></td>
        </tr>`).join('')+`</table></div>${statHtml}`:
        `<div style="color:#475569">今日无满足全部6条件的标的（规则逐条淘汰见下方漏斗）</div>${statHtml}`;
    }
  }catch(e){if(st)st.textContent='扫描失败: '+e.message}
  if(btn){btn.disabled=false;btn.textContent='14:30 立即选股'}
}

      const ac=x.action==='立即离场'?'#ef4444':x.action==='准备卖出/切换'?'#f59e0b':'#22c55e';
      h+=`<tr><td>${x.name}</td><td>${x.date}</td><td>${x.entry_price}</td>

  }else if(!d.candidates.length){
    h+='<div style="color:#475569;font-size:12px">今日无板块同时满足全部买入条件（横盘+连续流入+温和放量+涨停≥2+红盘>60%）</div>';
  }else{
    d.candidates.forEach((c,i)=>{

  </div>`;
  el.innerHTML=h;

let _shortScanTimer=null;
async function scanShortTerm(){
  const btn=document.getElementById('scan-btn');
  const st=document.getElementById('short-status');
  if(btn) btn.textContent='扫描中...';
  if(st) st.textContent='状态: 正在扫描...';
  try{
    const r=await fetch('/api/short_term/scan');
    const j=await r.json();
    if(j.code===0){
      if(j.data.length){
        renderShortAlerts(j.data);
        // 新预警声音通知
        playAlertSound();
        if(Notification.permission==='granted'){
          new Notification('短线预警',{body:`发现${j.count}只量能突变股票`,icon:''});
        }
      }
      if(st) st.textContent=`状态: 扫描完成, 发现${j.count}只异动 | ${new Date().toLocaleTimeString()}`;
    }
  }catch(e){
    if(st) st.textContent='状态: 扫描失败';
  }
  if(btn) btn.textContent='开始扫描';
}

function playAlertSound(){
  try{
    const ctx=new(window.AudioContext||window.webkitAudioContext)();
    const osc=ctx.createOscillator();
    const gain=ctx.createGain();
    osc.connect(gain);
    gain.connect(ctx.destination);
    osc.frequency.value=880;
    osc.type='sine';
    gain.gain.value=0.3;
    osc.start();
    gain.gain.exponentialRampToValueAtTime(0.01,ctx.currentTime+0.3);
    osc.stop(ctx.currentTime+0.3);
  }catch(e){}
}

    h+=`<span onclick="pickStock('${w.code}','${w.name}')" style="background:#0f172a;color:#e2e8f0;padding:4px 10px;border-radius:4px;font-size:12px;cursor:pointer;border:1px solid #334155;display:inline-flex;align-items:center;gap:4px">${w.name}<span style="color:#64748b;font-size:10px">${w.code}</span><span onclick="event.stopPropagation();removeWatch('${w.code}')" style="color:#ef4444;font-size:10px;margin-left:2px">✕</span></span>`;
  });
  h+='</div>';
  el.innerHTML=h;
}
async function toggleWatch(code,name){
  const idx=_watchlist.findIndex(w=>w.code===code);
  if(idx>=0){
    await fetch('/api/watchlist/remove',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({code})});
    _watchlist.splice(idx,1);
  }else{
    await fetch('/api/watchlist/add',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({code,name})});
    _watchlist.push({code,name});
  }
  renderWatchlist();
  updateStarBtn(code);
}
async function removeWatch(code){
  await fetch('/api/watchlist/remove',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({code})});
  _watchlist=_watchlist.filter(w=>w.code!==code);
  renderWatchlist();
  updateStarBtn(code);
}
function updateStarBtn(code){
  const btn=document.getElementById('wl-btn-'+code);
  if(!btn)return;
  const isWatched=_watchlist.some(w=>w.code===code);
  btn.textContent=isWatched?'★ 已关注':'☆ 关注';
  btn.style.color=isWatched?'#22c55e':'#f59e0b';
  btn.style.borderColor=isWatched?'#22c55e':'#334155';
}

window._behaviorHistory={};
async function loadBehaviorHistory(code){
  try{
    const r=await fetch('/api/behavior_history?code='+encodeURIComponent(code));
    const j=await r.json();
    if(j.code===0 && j.data.history){
      window._behaviorHistory=j.data.history;
    }
  }catch(e){}
}

async function doAnalyze(){
  const code=document.getElementById('scode').value.trim();
  if(!code)return;
  const stockCode=code.replace(/^(sh|sz)/,'');
  const el=document.getElementById('ares');
  el.innerHTML='<div style="text-align:center;color:#64748b;padding:40px">分析中...</div>';
  try{
    const r=await fetch('/api/stock_search?code='+encodeURIComponent(code));
    const j=await r.json();
    if(j.code!==0){el.innerHTML=`<div style="color:#ef4444;padding:20px;text-align:center">${j.msg}</div>`;return}
    renderAnalysis(j.data);
    updateStarBtn(stockCode);
  }catch(e){el.innerHTML='<div style="color:#ef4444;padding:20px;text-align:center">请求失败</div>'}
}

        series: [
          { name:'DIF', type:'line', data:d.dif, lineStyle:{width:1}, itemStyle:{color:'#3b82f6'} },
          { name:'DEA', type:'line', data:d.dea, lineStyle:{width:1}, itemStyle:{color:'#f59e0b'} },
          { name:'MACD', type:'bar', data:d.macd_bar.map(v=>({value:v,itemStyle:{color:v>=0?'#ef4444':'#22c55e'}})), barWidth:'55%' }
        ]
      });
    }catch(e){console.error('macd chart error:',e)}

    // KDJ
    try{
      const c4 = echarts.init(document.getElementById('ak-kdj'), 'dark');
      c4.setOption({
        tooltip: { trigger: 'axis', formatter: makeTooltipFormatter('KDJ') },
        legend: { data:['K','D','J'], textStyle:{color:'#94a3b8'}, top:0 },
        grid: { left:55, right:15, top:25, bottom:18 },
        xAxis: { type:'category', data:k.map(x=>x.date), axisLabel:{color:'#64748b',fontSize:9,rotate:30} },
        yAxis: { type:'value', min:0, max:100, axisLabel:{color:'#64748b'}, splitLine:{lineStyle:{color:'#1e293b'}} },
        series: [
          { name:'K', type:'line', data:d.k_values, lineStyle:{width:1}, itemStyle:{color:'#3b82f6'} },
          { name:'D', type:'line', data:d.d_values, lineStyle:{width:1}, itemStyle:{color:'#f59e0b'} },
          { name:'J', type:'line', data:d.j_values, lineStyle:{width:1}, itemStyle:{color:'#a855f7'} }
        ],
        markLine: { data:[{yAxis:20,lineStyle:{color:'#22c55e',type:'dashed'}},{yAxis:80,lineStyle:{color:'#ef4444',type:'dashed'}}] }
      });
    }catch(e){console.error('kdj chart error:',e)}

    window.addEventListener('resize',()=>{c?.resize();c3?.resize();c4?.resize()});
  }

  // 等待容器尺寸就绪
  function waitForContainerReady(){
    const containers = ['ak-kline','ak-macd','ak-kdj'];
    let allReady = true;
    for(const id of containers){
      const el = document.getElementById(id);
      if(!el || el.offsetWidth === 0 || el.offsetHeight === 0){
        allReady = false;
        break;
      }
}
    if(allReady){
      initCharts();
    }else{
      setTimeout(waitForContainerReady, 50);
    }
  }
  waitForContainerReady();
  // 异步加载交易决策
  loadTradingDecision(d.symbol);
}

/* 交易决策 */
async function loadTradingDecision(code){
  const el=document.getElementById('trading-decision-area');
  if(!el)return;
  el.innerHTML='<div style="background:#1e293b;border-radius:8px;padding:12px;margin-bottom:10px;text-align:center;color:#64748b">📊 交易决策分析中...</div>';
  const riskPref=localStorage.getItem('riskPref')||'moderate';
  const weightPreset=localStorage.getItem('weightPreset')||'balanced';
  try{
    const r=await fetch(`/api/trading_decision?code=${encodeURIComponent(code)}&risk=${riskPref}&preset=${weightPreset}`);
    const j=await r.json();
    if(j.code!==0){el.innerHTML='';return}
    renderTradingDecision(j.data,code);
  }catch(e){el.innerHTML=''}
}

        ${d.neu_signals.map(s=>'<div style="padding:1px 0;color:#e2e8f0"><span style="font-weight:bold">·</span> '+s.text+' <span style="color:#64748b;font-size:10px">'+s.detail+'</span></div>').join('')||'<div style="color:#475569">无</div>'}

/* 持仓管理 */
function openPositionModal(code,name,price){
  const html=`
  <div class="modal-overlay" id="pos-modal" onclick="if(event.target===this)this.remove()">
    <div class="modal">
      <h3>记录持仓 - ${name}</h3>
      <div class="modal-item">
        <label>成本价</label>
        <input id="pos-cost" type="number" step="0.01" value="${price}" style="width:100px;padding:6px;border:1px solid #334155;border-radius:4px;background:#0f172a;color:#e2e8f0">
      </div>
      <div class="modal-item">
        <label>数量（股）</label>
        <input id="pos-qty" type="number" step="100" value="100" style="width:100px;padding:6px;border:1px solid #334155;border-radius:4px;background:#0f172a;color:#e2e8f0">
      </div>
      <div class="modal-btns">
        <button class="btn-cancel" onclick="document.getElementById('pos-modal').remove()">取消</button>
        <button class="btn-save" onclick="savePosition('${code}')">保存</button>
      </div>
    </div>
  </div>`;
  document.body.insertAdjacentHTML('beforeend',html);
}

function savePosition(code){
  const cost=parseFloat(document.getElementById('pos-cost').value);
  const qty=parseInt(document.getElementById('pos-qty').value);
  if(!cost||!qty){alert('请输入有效数值');return}
  const positions=JSON.parse(localStorage.getItem('positions')||'{}');
  positions[code]={cost,qty,date:new Date().toISOString().slice(0,10)};
  localStorage.setItem('positions',JSON.stringify(positions));
  document.getElementById('pos-modal').remove();
  // 刷新交易决策
  loadTradingDecision(code);
}

function clearPosition(code){
  if(!confirm('确认清仓记录？'))return;
  const positions=JSON.parse(localStorage.getItem('positions')||'{}');
  delete positions[code];
  localStorage.setItem('positions',JSON.stringify(positions));
  loadTradingDecision(code);
}

/* 价格预警 */
function openAlertModal(code,name,price){
  const html=`
  <div class="modal-overlay" id="alert-modal" onclick="if(event.target===this)this.remove()">
    <div class="modal">
      <h3>设置价格预警 - ${name}</h3>
      <div class="modal-item">
        <label>预警价格</label>
        <input id="alert-price" type="number" step="0.01" value="${price}" style="width:100px;padding:6px;border:1px solid #334155;border-radius:4px;background:#0f172a;color:#e2e8f0">
      </div>
      <div class="modal-item">
        <label>触发条件</label>
        <select id="alert-direction" style="padding:6px 10px;border:1px solid #334155;border-radius:4px;background:#0f172a;color:#e2e8f0;font-size:13px">
          <option value="above">价格涨到（止盈）</option>
          <option value="below">价格跌到（止损）</option>
        </select>
      </div>
      <div class="modal-item">
        <label>备注</label>
        <input id="alert-message" type="text" placeholder="可选" style="width:150px;padding:6px;border:1px solid #334155;border-radius:4px;background:#0f172a;color:#e2e8f0">
      </div>
      <div class="modal-btns">
        <button class="btn-cancel" onclick="document.getElementById('alert-modal').remove()">取消</button>
        <button class="btn-save" onclick="saveAlert('${code}')">保存</button>
      </div>
    </div>
  </div>`;
  document.body.insertAdjacentHTML('beforeend',html);
}

async function saveAlert(code){
  const price=parseFloat(document.getElementById('alert-price').value);
  const direction=document.getElementById('alert-direction').value;
  const message=document.getElementById('alert-message').value;
  if(!price){alert('请输入有效价格');return}
  try{
    const r=await fetch('/api/alert/add',{
      method:'POST',
      headers:{'Content-Type':'application/json'},
      body:JSON.stringify({symbol:code,price,direction,message})
    });
    const j=await r.json();
    if(j.code===0){
      alert('预警已设置');
      document.getElementById('alert-modal').remove();
    }else{
      alert(j.msg||'设置失败');
    }
  }catch(e){alert('请求失败')}
}

async function checkAlerts(){
  try{
    const r=await fetch('/api/alert/check');
    const j=await r.json();
    if(j.code===0&&j.data.length>0){
      j.data.forEach(a=>{
        const msg=`${a.symbol} 价格${a.direction==='above'?'涨到':'跌到'} ${a.target}，当前 ${a.current}${a.message?' ('+a.message+')':''}`;
        alert(msg);
        // 尝试发送浏览器通知
        if(Notification.permission==='granted'){
          new Notification('价格预警',{body:msg});
        }
      });
    }
  }catch(e){}
}

// 定期检查预警（每60秒）
setInterval(checkAlerts,60000);
// 请求通知权限
if('Notification' in window&&Notification.permission==='default'){
  Notification.requestPermission();
}

async function loadHistoryLogs(){
  const code=document.getElementById('hcode').value.trim();
  const date=document.getElementById('hdate').value;
  const el=document.getElementById('hres');
  el.innerHTML='<div style="text-align:center;color:#64748b;padding:20px">加载中...</div>';
  try{
    let url='/api/log/list?';
    if(code)url+='symbol='+encodeURIComponent(code);
    if(date)url+=(code?'&':'')+'date='+date;
    const r=await fetch(url);
    const j=await r.json();
    if(j.code!==0||!j.data.length){
      el.innerHTML='<div style="text-align:center;color:#64748b;padding:20px">暂无记录</div>';return;
    }
    let h='<div class="card"><h3>分析记录 ('+j.data.length+'条)</h3><div class="tbl"><table><tr><th>日期</th><th>代码</th><th>名称</th><th>价格</th><th>涨跌</th><th>判断</th><th>吸筹</th><th>洗盘</th><th>出货</th><th>信号</th><th>5日量比</th></tr>';
    j.data.forEach(x=>{
      const bc=x.behavior==='吸筹'?'#ef4444':x.behavior==='洗盘'?'#22c55e':x.behavior==='出货'?'#f59e0b':'#94a3b8';
      h+=`<tr>
        <td>${x.date}</td><td>${x.symbol}</td><td>${x.name||''}</td>
        <td>${x.price}</td><td class="${C(x.pct_change)}">${P(x.pct_change)}</td>
        <td style="color:${bc};font-weight:bold">${x.behavior}</td>
        <td class="cup">${x.score_xichou}%</td><td class="cdn">${x.score_xipan}%</td>
        <td style="color:#f59e0b">${x.score_chuhuo}%</td>
        <td>${x.signals_count}</td><td>${x.vol_ratio}x</td>
      </tr>`;
    });
    el.innerHTML=h+'</table></div></div>';
  }catch(e){el.innerHTML='<div style="color:#ef4444;padding:20px">请求失败</div>'}
}

async function loadSuccessRate(){
  const el=document.getElementById('hres');
  el.innerHTML='<div style="text-align:center;color:#64748b;padding:20px">计算中...</div>';
  try{
    const r=await fetch('/api/log/success_rate');
    const j=await r.json();
    const d=j.data;
    if(!d.total){
      el.innerHTML='<div style="text-align:center;color:#64748b;padding:20px">数据不足(需至少2天记录)请持续使用几天后查看</div>';return;
    }
    const ga=d.group_a, gb=d.group_b;
    const rateColor=v=>v>=50?'#22c55e':'#ef4444';
    const bColor=b=>b==='吸筹'?'#ef4444':b==='洗盘'?'#22c55e':b==='出货'?'#f59e0b':'#94a3b8';

    let h=`<div class="card"><h3>AB组成功率对比</h3><div style="padding:10px">`;

    // AB组总体对比
    h+=`<div style="display:flex;gap:16px;justify-content:center;margin-bottom:16px">
      <div style="background:#0f172a;border-radius:8px;padding:12px 24px;text-align:center;flex:1;max-width:280px;border:1px solid #334155">
        <div style="color:#3b82f6;font-weight:bold;margin-bottom:4px">${ga.label}</div>
        <div style="font-size:28px;font-weight:bold;color:${rateColor(ga.overall_rate)}">${ga.overall_rate}%</div>
        <div style="color:#64748b;font-size:12px">${ga.correct}/${ga.total} 样本</div>
        <div style="color:#475569;font-size:11px;margin-top:4px">${ga.desc}</div>
      </div>
      <div style="background:#0f172a;border-radius:8px;padding:12px 24px;text-align:center;flex:1;max-width:280px;border:1px solid #334155">
        <div style="color:#a855f7;font-weight:bold;margin-bottom:4px">${gb.label}</div>
        <div style="font-size:28px;font-weight:bold;color:${rateColor(gb.overall_rate)}">${gb.overall_rate}%</div>
        <div style="color:#64748b;font-size:12px">${gb.correct}/${gb.total} 样本</div>
        <div style="color:#475569;font-size:11px;margin-top:4px">${gb.desc}</div>
      </div>
    </div>`;

    // 胜负提示
    if(ga.overall_rate > gb.overall_rate){
      h+=`<div style="text-align:center;color:#3b82f6;font-size:12px;margin-bottom:12px">A组(次日验证)暂时领先，继续观察</div>`;
    }else if(gb.overall_rate > ga.overall_rate){
      h+=`<div style="text-align:center;color:#a855f7;font-size:12px;margin-bottom:12px">B组(5日验证)暂时领先，5日验证更符合实际</div>`;
    }else{
      h+=`<div style="text-align:center;color:#64748b;font-size:12px;margin-bottom:12px">两组持平，数据量还不够</div>`;
    }

    // 按行为类型AB对比
    const allBehaviors = new Set([...Object.keys(ga.by_behavior), ...Object.keys(gb.by_behavior)]);
    if(allBehaviors.size){
      h+=`<div style="color:#64748b;font-size:12px;margin-bottom:6px">按行为类型对比:</div>`;
      h+=`<table style="font-size:12px"><tr><th>行为</th><th>A组(次日)</th><th>B组(5日)</th><th>领先</th></tr>`;
      for(const b of allBehaviors){
        const sa=ga.by_behavior[b]||{rate:0,correct:0,total:0};
        const sb=gb.by_behavior[b]||{rate:0,correct:0,total:0};
        const lead=sa.rate>sb.rate?'A':sb.rate>sa.rate?'B':'平';
        const leadColor=lead==='A'?'#3b82f6':lead==='B'?'#a855f7':'#64748b';
        h+=`<tr>
          <td style="color:${bColor(b)};font-weight:bold">${b}</td>
          <td style="color:${rateColor(sa.rate)}">${sa.rate}% (${sa.correct}/${sa.total})</td>
          <td style="color:${rateColor(sb.rate)}">${sb.rate}% (${sb.correct}/${sb.total})</td>
          <td style="color:${leadColor}">${lead}</td>
        </tr>`;
      }
      h+='</table>';
    }

    // 个股AB对比
    if(d.stocks.length){
      h+=`<div style="color:#64748b;font-size:12px;margin-top:12px;margin-bottom:6px">个股AB组对比:</div>`;
      h+=`<table style="font-size:12px"><tr><th>代码</th><th>名称</th><th>A组</th><th>B组</th><th>领先</th></tr>`;
      d.stocks.forEach(s=>{
        const lead=s.a_rate>s.b_rate?'A':s.b_rate>s.a_rate?'B':'平';
        const leadColor=lead==='A'?'#3b82f6':lead==='B'?'#a855f7':'#64748b';
        h+=`<tr><td>${s.symbol}</td><td>${s.name}</td>
          <td style="color:${rateColor(s.a_rate)}">${s.a_rate}%</td>
          <td style="color:${rateColor(s.b_rate)}">${s.b_rate}%</td>
          <td style="color:${leadColor}">${lead}</td></tr>`;
      });
      h+='</table>';
    }

    h+='</div></div>';
    el.innerHTML=h;
  }catch(e){el.innerHTML='<div style="color:#ef4444;padding:20px">请求失败</div>'}
}

    await new Promise(r=>setTimeout(r,2000));
  }
  document.getElementById('ld').innerHTML='<p style="color:#ef4444">超时,刷新重试</p>';
})();

window.addEventListener('resize',()=>{document.querySelectorAll('.box').forEach(el=>{const c=echarts.getInstanceByDom(el);if(c)c.resize()})});
</script>
</body>
